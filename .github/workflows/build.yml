name: Build shagunai

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download AI Models
        run: |
          mkdir -p app/src/main/assets/models

          wget -O app/src/main/assets/models/face_landmarker_Nx3x256x256.onnx \
            https://github.com/yakhyo/mediapipe-face-mesh-onnx/releases/download/weights/face_landmarker_Nx3x256x256.onnx

          wget -O app/src/main/assets/models/face_detection_short_range.onnx \
            https://github.com/yakhyo/mediapipe-face-mesh-onnx/releases/download/weights/face_detection_short_range.onnx

          echo "Downloaded models:"
          ls -lh app/src/main/assets/models/

      - name: Build APK
        run: |
          gradle clean assembleDebug --no-daemon --refresh-dependencies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShagunAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
